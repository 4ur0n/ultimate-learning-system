  misconception_signals: []
  evaluator:
    type: rubric-based-model
    confidence: null
routing:
  - condition: Primary item mastered independently
    route: tcp-udp-transfer-01
  - condition: Protocol selected without requirement extraction
    route: u9-requirement-first-remediation
  - condition: TCP message-boundary misconception detected
    route: u5-tcp-contrast-repair
  - condition: UDP delivery guarantee misconception detected
    route: u6-udp-visual-repair
  - condition: Primary item fails after remediation
    route: tcp-udp-choice-02
  - condition: Transfer item mastered independently
    route: complete
  - condition: Transfer reasoning incomplete
    route: schedule-targeted-review
student_model_update_policy:
  conservative: true
  updates:
    - concept: net.tcp
      capability: explain
      evidence_required:
        - Correct service-model explanation
    - concept: net.udp
      capability: explain
      evidence_required:
        - Correct best-effort datagram explanation
    - concept: net.tcp
      capability: compare
      evidence_required:
        - Correct contrast with UDP across at least two dimensions
    - concept: net.udp
      capability: compare
      evidence_required:
        - Correct contrast with TCP across at least two dimensions
    - concept: net.application-requirement
      capability: classify
      evidence_required:
        - Independent extraction of dominant requirements
    - concept: net.latency-overhead-tradeoff
      capability: apply
      evidence_required:
        - Independent justified choice plus changed-condition transfer
  limitations_to_record:
    - Delayed retention has not been measured.
    - Real implementation and performance testing have not been assessed.
    - Congestion control, security, and production deployment remain out of scope.
dependencies:
  - type: knowledge-model
    ref: examples/tcp-vs-udp/knowledge-slice.yaml
    version: 1
    required: true
  - type: lesson-plan
    ref: examples/tcp-vs-udp/lesson-plan.yaml
    version: 1
    required: true
