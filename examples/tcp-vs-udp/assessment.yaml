  attempt_id: null
  item_id: null
  learner_response: null
  timestamp: null
  hints_used: 0
  highest_hint_level: 0
  answer_exposure: none
  independence: independent
  evaluator_type: rubric-based-model
evaluation_template:
  correctness: null
  completeness: null
  weighted_score: null
  criterion_results: []
  misconception_signals: []
  claims_supported: []
  claims_weakened: []
  evaluator_confidence: null
  routing_decision: null
feedback_policy:
  sequence:
    - State what requirement reasoning was correct.
    - Identify the most important missing or incorrect distinction.
    - Give the smallest useful next step.
    - Do not expose the full answer unless the hint ladder reaches level 6.
  forbidden_feedback:
    - Praise based only on protocol naming.
    - Universal claims that TCP or UDP is always better.
    - Performance claims not justified by the scenario.
