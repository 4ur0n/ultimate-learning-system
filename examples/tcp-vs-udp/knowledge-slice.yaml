    - net.duplicate-delivery
misconception_patterns:
  - id: tcp-always-better
    pattern: Learner claims TCP is universally superior because it provides reliability.
    test: Present a stale real-time update scenario and ask whether recovery is always beneficial.
  - id: udp-always-faster
    pattern: Learner claims UDP guarantees lower application latency in every system and workload.
    test: Ask whether protocol choice alone determines end-to-end delay.
  - id: udp-no-reliability-possible
    pattern: Learner claims an application using UDP cannot add acknowledgments, sequencing, or recovery.
    test: Ask whether reliability must always be implemented by the transport protocol.
  - id: tcp-message-oriented
    pattern: Learner claims TCP preserves one-send-per-message boundaries.
    test: Ask whether two sends must be returned by two corresponding reads.
  - id: udp-guarantees-delivery
    pattern: Learner claims a sent UDP datagram is guaranteed to arrive exactly once and in order.
    test: Ask which delivery outcomes UDP itself guarantees.
  - id: reliability-equals-quality
    pattern: Learner treats reliability as a universal measure of protocol quality instead of one application-relevant property.
    test: Ask for one case where timeliness matters more than recovering old data.
