schema_version: 0.1.0
knowledge_slice_id: tcp-vs-udp-knowledge-v1
title: TCP and UDP transport service models
concepts:
  - id: net.transport-layer
    role: prerequisite
    definition: The networking layer that provides end-to-end communication services to applications.
    required_capabilities: [explain]
  - id: net.application-requirement
    role: prerequisite
    definition: A property the application needs from communication, such as completeness, ordering, timeliness, or message boundaries.
    required_capabilities: [classify]
  - id: net.tcp
    role: core
    definition: A connection-oriented transport protocol that presents a reliable ordered byte stream.
    required_capabilities: [explain, compare]
  - id: net.udp
    role: core
    definition: A connectionless transport protocol that provides best-effort datagrams and preserves datagram boundaries.
    required_capabilities: [explain, compare]
  - id: net.connection-state
    role: core
    definition: Transport-maintained state used to coordinate an ongoing communication relationship.
    required_capabilities: [compare]
  - id: net.reliability
    role: core
    definition: Mechanisms that detect loss and support recovery or retransmission.
    required_capabilities: [compare]
  - id: net.ordering
    role: core
    definition: Delivery of application data in the intended sequence.
    required_capabilities: [compare]
  - id: net.message-boundary
    role: core
    definition: Preservation of one application send as one separately identifiable transport message.
    required_capabilities: [compare]
  - id: net.latency-overhead-tradeoff
    role: transfer
    definition: The relationship between built-in transport guarantees, control work, recovery behavior, and application timing needs.
    required_capabilities: [apply]
  - id: net.reliable-ordered-byte-stream
    role: supporting
    definition: A continuous ordered sequence of bytes presented to the application with transport-managed recovery.
    required_capabilities: [explain]
  - id: net.best-effort-datagram
    role: supporting
    definition: An independently bounded transport message without built-in delivery or ordering guarantees.
    required_capabilities: [explain]
relationships:
  - source: net.tcp
    type: PROVIDES
    target: net.reliable-ordered-byte-stream
  - source: net.tcp
    type: MAINTAINS
    target: net.connection-state
  - source: net.tcp
    type: PROVIDES
    target: net.reliability
  - source: net.tcp
    type: PROVIDES
    target: net.ordering
  - source: net.tcp
    type: DOES_NOT_PRESERVE
    target: net.message-boundary
  - source: net.udp
    type: PROVIDES
    target: net.best-effort-datagram
  - source: net.udp
    type: PRESERVES
    target: net.message-boundary
  - source: net.udp
    type: DOES_NOT_PROVIDE_BUILT_IN
    target: net.reliability
  - source: net.udp
    type: DOES_NOT_PROVIDE_BUILT_IN
    target: net.ordering
  - source: net.application-requirement
    type: DETERMINES_RELEVANCE_OF
    target: net.latency-overhead-tradeoff
  - source: net.latency-overhead-tradeoff
    type: GUIDES_SELECTION_BETWEEN
    target: net.tcp
  - source: net.latency-overhead-tradeoff
    type: GUIDES_SELECTION_BETWEEN
    target: net.udp
prerequisite_closure:
