excluded_content:
  - item: teacher hypotheses
    reason: privacy
    detail: Internal uncertainty and diagnostic hypotheses are not learner-facing.
  - item: raw Student Model state
    reason: privacy
    detail: No private learner state is needed for the generic handout.
  - item: evaluator confidence and routing scores
    reason: out-of-scope
    detail: Internal runtime metadata does not support the learner artifact.
  - item: congestion-control internals
    reason: out-of-scope
    detail: The learning contract targets transport service semantics, not algorithm internals.
  - item: QUIC and transport security
    reason: out-of-scope
    detail: These require separate learning contracts.
visual_assets:
  - asset_id: tcp-udp-delivery-model
    format: svg
    path: examples/tcp-vs-udp/assets/tcp-udp-delivery-model.svg
    objective: Contrast TCP ordered recovery with UDP independent best-effort datagrams.
    concepts:
      - net.tcp
      - net.udp
      - net.reliability
      - net.ordering
      - net.message-boundary
    interpretation_question: Which path restores ordering before delivery, and which path preserves separate message boundaries without built-in recovery?
    accessibility:
      title: TCP ordered recovery compared with UDP best-effort datagrams
      description: The TCP lane shows missing data being retransmitted and reordered before one byte stream is delivered. The UDP lane shows separate datagrams that may be lost or reordered while received datagram boundaries remain preserved.
      non_color_encoding: true
      reading_order:
        - tcp-lane
        - tcp-recovery
        - tcp-byte-stream-output
        - udp-lane
        - udp-loss-and-reorder
        - udp-datagram-output
        - requirement-dependent-takeaway
    source_refs:
      - tcp-rfc-semantics
      - udp-rfc-semantics
