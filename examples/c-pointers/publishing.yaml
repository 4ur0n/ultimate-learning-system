visual_assets:
  - asset_id: pointer-memory-model
    format: svg
    path: examples/c-pointers/assets/pointer-memory-model.svg
    objective: Show that p stores an address and dereference follows it to access x.
    concepts:
      - c.pointer-object
      - c.address
      - c.object
      - c.dereference-operator
    interpretation_question: Which object stores 0x200, which object stores 42, and what path does dereference follow?
    accessibility:
      title: Pointer value and target value
      description: Pointer p stores address 0x200, which identifies object x. Object x stores 42. Dereferencing p follows 0x200 to access x.
      non_color_encoding: true
      reading_order:
        - pointer-object-p
        - pointer-address-value
        - dereference-operation
        - target-object-x
        - target-stored-value
    source_refs:
      - c-standard-pointer-semantics
