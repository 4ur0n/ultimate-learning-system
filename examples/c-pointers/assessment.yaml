  evidence_id: <identifier>
  claims_supported: []
  claims_weakened: []
  misconception_signals: []
  student_model_update_allowed: <boolean>
  update_reason: <reason>
routing:
  if_pass: u6-transfer
  if_partial: u5-remediate-write-through
  if_fail: u5-remediate-write-through
  if_invalid_attempt: u5-fresh-retry
  if_indeterminate: human-or-higher-confidence-review
student_model_update_policy:
  allow_when:
    - required conceptual criteria are complete
    - attempt conditions are valid for the claimed independence level
    - evaluator confidence is at least 0.8
  prohibit_when:
    - full answer exposure occurred
    - response was copied
    - evaluator result is indeterminate
    - only aggregate score passes while a required conceptual criterion fails
  claim_limits:
    - Immediate success does not establish retention.
    - Same-structure success does not establish far transfer.
    - Passing this assessment does not establish global pointer mastery.
validation:
  construct:
    status: passed
    issues: []
  evidence_integrity:
    status: passed
    issues: []
  rubric:
    status: passed
    issues: []
  privacy:
    status: passed
    issues: []
